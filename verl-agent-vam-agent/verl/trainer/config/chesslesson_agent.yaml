defaults:
  - ppo_trainer
  - _self_

# Inline the algorithm.hgpo block (avoids cross-package hydra searchpath).
# Mirrors recipe/hgpo/config/hgpo_trainer.yaml's defaults.
algorithm:
  hgpo:
    mode: "mean_std_norm"
    weight_type: "length"
    length_weight_alpha: 1.0
    base_group: false
  filter_groups:
    enable: False
    metric: null
    max_num_gen_batches: 0

# HGPO trainer expects episode-level reward
reward_model:
  reward_manager: episode

env:
  env_name: chesslesson/LichessLearn
  seed: 0
  # multi-turn online: one move per turn. The worker (LessonStepper) ends the
  # episode early on success/failure; this is the hard cap for unsolved lessons.
  # Coordinate tasks finish in a single step regardless.
  max_steps: 8
  # 0: the board FEN is self-describing each turn, and the model already sees the
  # prior turns in the rollout transcript, so no extra embedded history needed.
  history_length: 0
  chesslesson:
    include_chess: True
    include_coord: True
    # optional board under each FEN line: null (FEN-only), ascii, or unicode
    board_repr: null
    # Curriculum cap: max nbMoves for chess lessons (coord drills always in).
    # null = no cap (170 tasks). Phase 1=1, 2=2, 3=4, 4=null.
    max_budget: null

data:
  train_files: ~/data/verl-agent/text/train.parquet
  val_files: ~/data/verl-agent/text/test.parquet
  train_batch_size: 16
  val_batch_size: 16
  max_prompt_length: 4096
  max_response_length: 512
  return_raw_chat: True
  filter_overlong_prompts: True
  truncation: left

trainer:
  project_name: verl-chesslesson
  experiment_name: chesslesson_ppo
